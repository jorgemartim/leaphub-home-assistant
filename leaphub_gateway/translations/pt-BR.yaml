configuration:
  connector_enabled:
    name: Ativar Connector Leapmotor
    description: Recebe solicitações assinadas do Leap Hub para consultar conta e veículos.
  staging_secret:
    name: Chave do Connector Beta
    description: Chave HMAC criada no ambiente Beta.
  production_secret:
    name: Chave do Connector Produção
    description: Chave HMAC criada na Produção. Use uma chave diferente da Beta.
  connector_max_parallel:
    name: Consultas simultâneas do Connector
    description: Limite de operações simultâneas contra a nuvem Leapmotor.
  connector_manual_wait_seconds:
    name: Espera de operações manuais
    description: Segundos que uma ação manual pode aguardar vaga antes de retornar ocupado.
  connector_manual_settle_seconds:
    name: Janela de estabilização pós-comando
    description: Tempo máximo reservado à confirmação em segundo plano; não atrasa o aceite inicial do comando.
  telemetry_beta_enabled:
    name: Ativar telemetria contínua Beta
    description: Coleta dados adaptativamente e entrega ao ambiente Beta.
  telemetry_beta_internal_url:
    name: Endpoint interno de telemetria Beta
    description: URL HTTPS que recebe a fila persistente no Leap Hub Beta.
  telemetry_production_enabled:
    name: Ativar telemetria contínua Produção
    description: Ative somente após configurar a chave e o site de Produção.
  telemetry_production_internal_url:
    name: Endpoint interno de telemetria Produção
    description: URL HTTPS que recebe a fila no Leap Hub de Produção.
  telemetry_background_enabled:
    name: Monitorar sem abrir o Leap Hub
    description: Mantém a coleta adaptativa ativa em segundo plano para registrar viagens e mudanças do veículo.
  telemetry_background_seconds:
    name: Intervalo máximo em segundo plano
    description: Tempo máximo entre verificações quando o veículo está em repouso e nenhuma tela do Leap Hub está aberta.
  telemetry_active_seconds:
    name: Intervalo durante viagem
    description: Consulta automática rápida durante viagem. O padrão é 20 segundos e usa proteção com recuo em caso de limite ou falha.
  telemetry_interactive_seconds:
    name: Intervalo com o Leap Hub aberto
    description: Frequência temporária enquanto uma tela autenticada do veículo estiver visível.
  telemetry_command_seconds:
    name: Intervalo de confirmação de comando
    description: Tempo entre leituras usadas para confirmar um comando já enviado, sem repetir a ação física.
  telemetry_command_max_polls:
    name: Máximo de confirmações por comando
    description: "Limita quantas leituras podem tentar confirmar o novo estado. Recomendado: 5."
  telemetry_charging_seconds:
    name: Intervalo durante recarga
    description: Consulta automática durante carregamento. O padrão é 25 segundos para detectar o início e acompanhar a curva.
  telemetry_parked_seconds:
    name: Intervalo estacionado
    description: Frequência automática quando estacionado. O padrão é 90 segundos para detectar cabo, recarga ou início de viagem.
  telemetry_sleep_seconds:
    name: Intervalo em repouso prolongado
    description: Frequência econômica após repouso prolongado. O padrão é 600 segundos, limitado pelo monitoramento em segundo plano quando ele estiver ativo.
  telemetry_rate_limit_cooldown_seconds:
    name: Pausa de proteção da nuvem Leapmotor
    description: Tempo de espera automático quando o Gateway detectar limitação de requisições. O padrão é 15 minutos.
  telemetry_presence_window_seconds:
    name: Janela de presença do site
    description: Por quanto tempo a cadência interativa permanece ativa após a última presença autenticada.
  telemetry_request_timeout_seconds:
    name: Timeout de cada chamada à nuvem
    description: "Limite de espera por uma resposta da nuvem Leapmotor. Recomendado: 15 segundos."
  telemetry_poll_workers:
    name: Coletores de contas em paralelo
    description: Contas diferentes podem ser consultadas em paralelo; uma mesma conta continua serializada.
  telemetry_session_idle_seconds:
    name: Sessão ociosa reutilizável
    description: Tempo que uma sessão saudável pode ficar ociosa antes de ser encerrada.
  telemetry_vehicle_list_cache_seconds:
    name: Cache da lista de veículos
    description: Evita pedir novamente a mesma lista de veículos a cada leitura.
  telemetry_message_cache_seconds:
    name: Cache de mensagens da conta
    description: Evita repetir consultas de mensagens sem mudança relevante.
  telemetry_batch_size:
    name: Eventos por envio
    description: Quantidade máxima de leituras enviadas ao site em cada lote.
  telemetry_retention_days:
    name: Retenção local após confirmação
    description: Dias que eventos já entregues permanecem no Home Assistant.
  telemetry_queue_max_events:
    name: Limite da fila local
    description: Proteção de armazenamento para a fila persistente.
  ocpp_beta_enabled:
    name: Ativar OCPP Beta
    description: Inicia o gateway OCPP unificado na porta 8092.
  ocpp_beta_internal_url:
    name: URL interna OCPP Beta
    description: Endpoint HTTPS do Leap Hub Beta.
  ocpp_beta_secret:
    name: Chave OCPP Beta
    description: Chave criada na página Servidor OCPP do Beta.
  ocpp_beta_max_connections:
    name: Limite de carregadores Beta
    description: Máximo de conexões OCPP simultâneas.
  ocpp_production_enabled:
    name: Ativar OCPP Produção
    description: Seleciona Produção como único ambiente proprietário do OCPP. Não ative junto com o Beta.
  ocpp_production_internal_url:
    name: URL interna OCPP Produção
    description: Endpoint HTTPS do Leap Hub Produção.
  ocpp_production_secret:
    name: Chave OCPP Produção
    description: Chave criada na página Servidor OCPP da Produção.
  ocpp_production_max_connections:
    name: Limite de carregadores Produção
    description: Máximo de conexões OCPP simultâneas.
  ocpp_ping_interval_seconds:
    name: Intervalo de ping OCPP
    description: Frequência do keepalive da conexão dos carregadores.
  ocpp_liveness_timeout_seconds:
    name: Timeout de presença OCPP
    description: Tempo sem tráfego antes de considerar uma conexão possivelmente inativa.
  ocpp_disconnect_grace_seconds:
    name: Tolerância de desconexão OCPP
    description: Janela curta para evitar oscilações de status durante uma reconexão imediata.
  ocpp_queue_max_events:
    name: Limite da fila OCPP
    description: Proteção local para eventos e resultados aguardando entrega ao site.
  ocpp_queue_retention_days:
    name: Retenção da fila OCPP
    description: Dias de retenção dos itens já encerrados no armazenamento local.
  tunnel_enabled:
    name: Ativar Cloudflare Tunnel
    description: Ative somente depois de apontar as rotas para local-leaphub-gateway.
  tunnel_token:
    name: Token do Cloudflare Tunnel
    description: Token completo. Ele não aparece nos logs nem na linha de comando.
  tunnel_log_level:
    name: Nível de log do Tunnel
    description: Quantidade de detalhes do cloudflared.
  tunnel_protocol:
    name: Protocolo do Tunnel
    description: HTTP/2 é o modo estável recomendado; Auto permite negociação automática.
  log_level:
    name: Nível de log dos serviços
    description: Quantidade de detalhes do Connector, OCPP e supervisor interno.
  dashboard_log_lines:
    name: Linhas de log no painel
    description: Quantidade máxima de linhas recentes exibidas por serviço.
network:
  8092/TCP: OCPP Beta para o Cloudflare Tunnel
  8093/TCP: OCPP Produção para o Cloudflare Tunnel
  8094/TCP: Connector Leapmotor para o Cloudflare Tunnel
  8099/TCP: Painel interno protegido pelo Ingress
