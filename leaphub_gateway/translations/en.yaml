configuration:
  connector_enabled:
    name: Enable Leapmotor Connector
    description: Accept signed Leap Hub requests for account and vehicle data.
  staging_secret:
    name: Beta Connector key
    description: HMAC key generated in the Beta environment.
  production_secret:
    name: Production Connector key
    description: HMAC key generated in Production.
  connector_max_parallel:
    name: Parallel Connector requests
    description: Maximum simultaneous Leapmotor cloud operations.
  connector_manual_wait_seconds:
    name: Manual operation wait
    description: Seconds a manual request may wait for an available cloud operation slot.
  connector_manual_settle_seconds:
    name: Post-command settling window
    description: Maximum background confirmation window; it does not delay initial command acceptance.
  telemetry_beta_enabled:
    name: Enable Beta continuous telemetry
    description: Poll adaptively and deliver data to the Beta environment.
  telemetry_beta_internal_url:
    name: Beta telemetry internal endpoint
    description: HTTPS URL that receives the persistent queue in Leap Hub Beta.
  telemetry_production_enabled:
    name: Enable Production continuous telemetry
    description: Enable only after configuring Production site and secret.
  telemetry_production_internal_url:
    name: Production telemetry internal endpoint
    description: HTTPS URL that receives the Production queue.
  telemetry_background_enabled:
    name: Monitor without opening Leap Hub
    description: Keep adaptive collection active in the background to record trips and vehicle changes.
  telemetry_background_seconds:
    name: Maximum background interval
    description: Maximum delay between checks while the vehicle is resting and no Leap Hub screen is open.
  telemetry_active_seconds:
    name: Driving interval
    description: Polling frequency while driving or READY.
  telemetry_interactive_seconds:
    name: Leap Hub open interval
    description: Temporary polling frequency while an authenticated vehicle page is visible.
  telemetry_command_seconds:
    name: Command confirmation interval
    description: Delay between state reads that confirm an already dispatched command without repeating it.
  telemetry_command_max_polls:
    name: Maximum command confirmations
    description: Maximum state reads used to confirm a new state. Recommended value is 5.
  telemetry_charging_seconds:
    name: Charging interval
    description: Polling frequency while charging.
  telemetry_parked_seconds:
    name: Parked interval
    description: Initial polling frequency while parked.
  telemetry_sleep_seconds:
    name: Extended rest interval
    description: Economy frequency after repeated parked readings.
  telemetry_rate_limit_cooldown_seconds:
    name: Leapmotor cloud protection cooldown
    description: Automatic pause when request limiting is detected. Default is 15 minutes.
  telemetry_presence_window_seconds:
    name: Site presence window
    description: How long interactive cadence stays active after the last authenticated presence.
  telemetry_request_timeout_seconds:
    name: Cloud request timeout
    description: Maximum wait for a Leapmotor cloud response. Recommended value is 15 seconds.
  telemetry_poll_workers:
    name: Parallel account pollers
    description: Different accounts can run in parallel while each account remains serialized.
  telemetry_session_idle_seconds:
    name: Reusable idle session
    description: How long a healthy idle session remains reusable.
  telemetry_vehicle_list_cache_seconds:
    name: Vehicle list cache
    description: Avoids requesting the same account vehicle list on every poll.
  telemetry_message_cache_seconds:
    name: Account message cache
    description: Avoids repeating message calls when nothing relevant changed.
  telemetry_batch_size:
    name: Events per delivery
    description: Maximum readings sent to the site in one batch.
  telemetry_retention_days:
    name: Local retention after delivery
    description: Days confirmed events remain in Home Assistant.
  telemetry_queue_max_events:
    name: Local queue limit
    description: Storage protection for the persistent queue.
  ocpp_beta_enabled:
    name: Enable OCPP Beta
    description: Selects Beta as the single OCPP owner. Do not enable it together with Production.
  ocpp_beta_internal_url:
    name: OCPP Beta internal URL
    description: Leap Hub Beta HTTPS endpoint.
  ocpp_beta_secret:
    name: OCPP Beta key
    description: Key generated on the Beta OCPP server page.
  ocpp_beta_max_connections:
    name: Beta charger limit
    description: Maximum simultaneous OCPP connections.
  ocpp_production_enabled:
    name: Enable OCPP Production
    description: Selects Production as the single OCPP owner. Do not enable it together with Beta.
  ocpp_production_internal_url:
    name: OCPP Production internal URL
    description: Leap Hub Production HTTPS endpoint.
  ocpp_production_secret:
    name: OCPP Production key
    description: Key generated on the Production OCPP server page.
  ocpp_production_max_connections:
    name: Production charger limit
    description: Maximum simultaneous OCPP connections.
  ocpp_ping_interval_seconds:
    name: OCPP ping interval
    description: Charger connection keepalive frequency.
  ocpp_liveness_timeout_seconds:
    name: OCPP liveness timeout
    description: Time without traffic before a connection is considered potentially inactive.
  ocpp_disconnect_grace_seconds:
    name: OCPP disconnect grace
    description: Short window that prevents status flapping during an immediate reconnect.
  ocpp_queue_max_events:
    name: OCPP queue limit
    description: Local protection for events and command results waiting for delivery.
  ocpp_queue_retention_days:
    name: OCPP queue retention
    description: Days completed queue records remain in local storage.
  tunnel_enabled:
    name: Enable Cloudflare Tunnel
    description: Enable only after routes target local-leaphub-gateway.
  tunnel_token:
    name: Cloudflare Tunnel token
    description: Full token. It is never shown in logs or process arguments.
  tunnel_log_level:
    name: Tunnel log level
    description: cloudflared logging detail.
  tunnel_protocol:
    name: Tunnel protocol
    description: HTTP/2 is the recommended stable mode; Auto allows automatic negotiation.
  log_level:
    name: Service log level
    description: Connector, OCPP and supervisor logging detail.
  dashboard_log_lines:
    name: Dashboard log lines
    description: Maximum recent lines shown per service.
network:
  8092/TCP: OCPP Beta for Cloudflare Tunnel
  8093/TCP: Legacy OCPP port (unused by new installations)
  8094/TCP: Leapmotor Connector for Cloudflare Tunnel
  8099/TCP: Internal Ingress dashboard
