name: Build and publish Leap Hub Gateway

on:
  push:
    branches: [main]
    paths:
      - "leaphub_gateway/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: leaphub-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorgemartim/leaphub-gateway

jobs:
  build:
    name: Validate, pre-build and publish amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read App version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' leaphub_gateway/config.yaml | head -n1)"
          image="$(sed -n 's/^image:[[:space:]]*"\([^"]*\)".*/\1/p' leaphub_gateway/config.yaml | head -n1)"
          test -n "${version}"
          test "${image}" = "ghcr.io/jorgemartim/leaphub-gateway"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          # Runtime dependencies are installed inside the cached Docker layer.
          # CI only needs PyYAML for the repository validator, avoiding a duplicate pip install.
          python3 -m pip install --quiet PyYAML==6.0.2
          python3 .github/scripts/validate_repository.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cached image locally
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.app.outputs.version }}"
          docker buildx build \
            --pull \
            --load \
            --platform linux/amd64 \
            --cache-from type=gha,scope=leaphub-gateway-amd64 \
            --cache-to type=gha,mode=max,scope=leaphub-gateway-amd64 \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION="${{ steps.app.outputs.version }}" \
            --tag "${image}" \
            ./leaphub_gateway

      - name: Smoke-test exact runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.app.outputs.version }}"
          docker run --rm --entrypoint python3 "${image}" -c \
            "import leaphub_connector, leaphub_telemetry_engine; from leaphub_telemetry_engine import TelemetryEngine; import connector_server, ocpp_gateway, gateway_manager; print('runtime imports ok')"
          docker run --rm --entrypoint sh "${image}" -c \
            "test -s /app/telemetry_engine.py && test -s /usr/local/lib/python3.12/site-packages/leaphub_telemetry_engine.py"

      - name: Publish immutable version and latest tags
        shell: bash
        run: |
          set -euo pipefail
          versioned="${REGISTRY}/${IMAGE_NAME}:${{ steps.app.outputs.version }}"
          latest="${REGISTRY}/${IMAGE_NAME}:latest"
          docker push "${versioned}"
          docker tag "${versioned}" "${latest}"
          docker push "${latest}"

      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.app.outputs.version }}"
          for attempt in $(seq 1 12); do
            if docker buildx imagetools inspect "${image}" | grep -q "linux/amd64"; then
              echo "Manifest published and linux/amd64 confirmed."
              exit 0
            fi
            echo "Manifest not ready; attempt ${attempt}/12."
            sleep 10
          done
          exit 1

      - name: Verify anonymous image access
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.app.outputs.version }}"
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true
          for attempt in $(seq 1 6); do
            if docker buildx imagetools inspect "${image}" | grep -q "linux/amd64"; then
              echo "Anonymous GHCR access confirmed. Home Assistant can pull the pre-built image."
              exit 0
            fi
            echo "Anonymous access not ready; attempt ${attempt}/6."
            sleep 10
          done
          echo "The image exists but is not anonymously accessible. Set the GHCR package visibility to Public." >&2
          exit 1
