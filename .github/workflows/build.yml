name: Build and publish Leap Hub Gateway

on:
  push:
    branches: [main]
    paths:
      - "leaphub_gateway/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: leaphub-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorgemartim/leaphub-gateway

jobs:
  build:
    name: Validate, build and publish amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read App version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' leaphub_gateway/config.yaml | head -n1)"
          image="$(sed -n 's/^image:[[:space:]]*"\([^"]*\)".*/\1/p' leaphub_gateway/config.yaml | head -n1)"
          test -n "${version}"
          test "${image}" = "ghcr.io/jorgemartim/leaphub-gateway"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyYAML==6.0.2
          python3 .github/scripts/validate_repository.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish pre-compiled image
        uses: docker/build-push-action@v7
        with:
          context: ./leaphub_gateway
          file: ./leaphub_gateway/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ghcr.io/jorgemartim/leaphub-gateway:${{ steps.app.outputs.version }}
            ghcr.io/jorgemartim/leaphub-gateway:latest
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.app.outputs.version }}
          cache-from: type=gha,scope=leaphub-gateway-amd64
          cache-to: type=gha,mode=max,scope=leaphub-gateway-amd64

      - name: Verify published image while authenticated
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.app.outputs.version }}"
          docker buildx imagetools inspect "${image}" >/dev/null
          docker pull "${image}"
          docker run --rm --entrypoint python3 "${image}" -c \
            "import leaphub_connector, leaphub_telemetry_engine; from leaphub_telemetry_engine import TelemetryEngine; import connector_server, ocpp_gateway, gateway_manager; print('runtime imports ok')"

      - name: Check anonymous GHCR access for Home Assistant
        id: anonymous
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.app.outputs.version }}"
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true
          docker buildx imagetools inspect "${image}" >/dev/null

      - name: Explain first-publication visibility
        if: steps.anonymous.outcome != 'success'
        shell: bash
        run: |
          echo "::warning title=GHCR package is private::The image was published successfully, but Home Assistant cannot download a private GHCR package. Open the leaphub-gateway package settings in GitHub, change Package visibility to Public, then refresh the Home Assistant App repository. This is normally required only once, on the first publication."

      - name: Confirm distribution status
        shell: bash
        run: |
          if [ "${{ steps.anonymous.outcome }}" = "success" ]; then
            echo "Pre-built image is public and ready for Home Assistant."
          else
            echo "Pre-built image exists; one-time GHCR visibility change to Public is still required."
          fi
