name: Build and publish Leap Hub Gateway

on:
  push:
    branches: [main]
    paths:
      - "leaphub_gateway/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: leaphub-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorgemartim/leaphub-gateway

jobs:
  build:
    name: Validate, build and publish amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read App version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' leaphub_gateway/config.yaml | head -n1)"
          image="$(sed -n 's/^image:[[:space:]]*"\([^"]*\)".*/\1/p' leaphub_gateway/config.yaml | head -n1)"
          test -n "${version}"
          test "${image}" = "ghcr.io/jorgemartim/leaphub-gateway"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}:${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyYAML==6.0.2
          python3 .github/scripts/validate_repository.py

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q leaphub_gateway

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish pre-compiled image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./leaphub_gateway
          file: ./leaphub_gateway/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ghcr.io/jorgemartim/leaphub-gateway:${{ steps.app.outputs.version }}
            ghcr.io/jorgemartim/leaphub-gateway:latest
          labels: |
            org.opencontainers.image.source=https://github.com/jorgemartim/leaphub-home-assistant
            org.opencontainers.image.version=${{ steps.app.outputs.version }}
          build-args: |
            BUILD_ARCH=amd64
            BUILD_VERSION=${{ steps.app.outputs.version }}
          cache-from: type=gha,scope=leaphub-gateway-amd64
          cache-to: type=gha,mode=max,scope=leaphub-gateway-amd64
          provenance: false

      - name: Smoke test exact published image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.app.outputs.image }}"
          docker buildx imagetools inspect "${image}" >/dev/null
          docker pull "${image}"
          docker run --rm --entrypoint python3 "${image}" -c \
            "import leaphub_connector, leaphub_telemetry_engine, leaphub_connection_orchestrator, leaphub_event_transport; import connector_server, ocpp_gateway, gateway_manager; print('runtime imports ok')"

      - name: Verify anonymous image access for Home Assistant
        id: anonymous
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.app.outputs.image }}"
          docker logout "${REGISTRY}" >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
              echo "public=true" >> "${GITHUB_OUTPUT}"
              echo "GHCR image is public and ready for Home Assistant: ${image}"
              exit 0
            fi
            echo "Anonymous manifest check ${attempt}/6 failed; waiting for registry propagation..."
            sleep 10
          done
          echo "public=false" >> "${GITHUB_OUTPUT}"
          echo "::warning title=GHCR access not confirmed::The image was built and published, but anonymous access was not confirmed yet. If this is the first package publication, set the leaphub-gateway package visibility to Public. Otherwise wait for GHCR propagation before updating Home Assistant."
          exit 1

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Leap Hub Gateway ${{ steps.app.outputs.version }}"
            echo
            echo "- Image: \`${{ steps.app.outputs.image }}\`"
            echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- Architecture: \`linux/amd64\`"
            echo "- Anonymous GHCR check: \`${{ steps.anonymous.outcome }}\`"
            echo
            echo "Only update Home Assistant after the image build and smoke test are successful."
          } >> "${GITHUB_STEP_SUMMARY}"
